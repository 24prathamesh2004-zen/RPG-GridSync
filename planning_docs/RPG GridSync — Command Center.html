svg{display:block;width:100%;height:auto}
.hz{display:grid;grid-template-columns:38px repeat(24,minmax(20px,1fr));gap:2px;min-width:640px;font-size:10px;color:var(--mu);font-weight:700;align-items:center}
.hc{height:24px;border-radius:5px;border:0;cursor:pointer;padding:0}.hc:hover{transform:scale(1.25);z-index:2;position:relative}.t0{background:#43b581}.t1{background:#f3c969}.t2{background:#e8776b}.hc.nw{box-shadow:inset 0 0 0 2px #0f1f38}.hc.sl{outline:3px solid var(--bl);outline-offset:1px;z-index:3;position:relative}
.hz span.hr{text-align:center}input[type=range]{width:100%;accent-color:var(--te)}
@media(max-width:900px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px}.brand,.org,.nl{display:none}.nv{white-space:nowrap}.g4,.g5{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}main{padding:16px}.top{padding:12px 16px}}
