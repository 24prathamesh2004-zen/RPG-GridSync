version: "3.9"

# GridSync — SQLite + Groq, no external infrastructure required.
# For production scale, swap SQLite for PostgreSQL (update DATABASE_URL).

services:
  # ── GridSync API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./gridsync.db
    volumes:
      - .:/app
      - gridsync_data:/app/data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── GridSync UI ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on: [api]

volumes:
  gridsync_data:
